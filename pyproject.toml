[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "english-data-query"
version = "0.1.0"
description = "Governed, metadata-grounded banking query demonstration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.119,<1", "uvicorn>=0.37,<1", "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.16,<2",
  "httpx>=0.28,<1", "sqlglot>=30.29,<31", "trino>=0.340,<1",
  "streamlit>=1.50,<2", "plotly>=6,<8", "pandas>=2.3,<4",
  "PyJWT[crypto]>=2.10,<3", "boto3>=1.40,<2", "prometheus-client>=0.23,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
