password-authenticator.name=ldap
ldap.url=ldaps://REPLACE_WITH_DIRECTORY_HOST:636
ldap.allow-insecure=false
ldap.ssl.truststore.path=/etc/trino/trust/directory-ca.pem
# AD example: canonical short username is passed by the application.
# Replace the suffix; for OpenLDAP replace this with your actual user DN pattern.
ldap.user-bind-pattern=${USER}@REPLACE_WITH_AD_DOMAIN
ldap.timeout.connect=5s
ldap.timeout.read=5s
# Revalidate binds; assess AD lockout/load requirements before changing this.
ldap.cache-ttl=0s
